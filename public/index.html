<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Blogger Indexer</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f4f5; padding: 2rem; max-width: 800px; margin: auto; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; color: #18181b; }
        label { font-weight: bold; display: block; margin: 1rem 0 0.5rem; font-size: 0.9rem; }
        textarea, input { width: 100%; padding: 0.75rem; border: 1px solid #d4d4d8; border-radius: 4px; box-sizing: border-box; font-family: monospace; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        button { margin-top: 1.5rem; width: 100%; padding: 1rem; background: #2563eb; color: white; border: none; border-radius: 4px; font-size: 1.1rem; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        table { width: 100%; border-collapse: collapse; margin-top: 2rem; font-size: 0.9rem; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e4e4e7; }
        th { background: #f8fafc; }
        #loader { display: none; text-align: center; margin-top: 1rem; color: #2563eb; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🤖 Auto-Blogger Indexing Tool</h1>
        <p>This tool automatically creates a Blogger post for your target URL and submits it to Google.</p>
        
        <label>Target URLs to Index (e.g., script.google.com URLs)</label>
        <textarea id="urls" rows="3" placeholder="https://script.google.com/..."></textarea>

        <label>Google Indexing Service Account JSON</label>
        <textarea id="googleKey" rows="2" placeholder='{"type": "service_account", ...}'></textarea>

        <div class="grid">
            <div>
                <label>Blogger Blog ID</label>
                <input type="text" id="blogId" placeholder="e.g. 1234567890">
            </div>
            <div>
                <label>Blogger Refresh Token</label>
                <input type="password" id="refreshToken" placeholder="1//04x...">
            </div>
            <div>
                <label>OAuth Client ID</label>
                <input type="password" id="clientId" placeholder="...">
            </div>
            <div>
                <label>OAuth Client Secret</label>
                <input type="password" id="clientSecret" placeholder="...">
            </div>
        </div>

        <button onclick="submitUrls()">Auto-Post & Index</button>
        <div id="loader">Processing... Generating posts and pinging Google.</div>

        <table id="resultsTable" style="display:none;">
            <thead><tr><th>Target URL</th><th>New Blogger URL</th><th>Status</th></tr></thead>
            <tbody id="resultsBody"></tbody>
        </table>
    </div>

    <script>
        async function submitUrls() {
            const payload = {
                urls: document.getElementById('urls').value,
                googleKey: document.getElementById('googleKey').value,
                blogId: document.getElementById('blogId').value,
                refreshToken: document.getElementById('refreshToken').value,
                clientId: document.getElementById('clientId').value,
                clientSecret: document.getElementById('clientSecret').value
            };

            const loader = document.getElementById('loader');
            const table = document.getElementById('resultsTable');
            const tbody = document.getElementById('resultsBody');

            if(!payload.urls || !payload.googleKey || !payload.blogId || !payload.refreshToken) {
                return alert("Please fill in all required fields.");
            }

            loader.style.display = 'block';
            table.style.display = 'none';
            tbody.innerHTML = '';

            try {
                const response = await fetch('/api/index-auto', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                data.results.forEach(res => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${res.targetUrl}</td><td><a href="${res.bloggerUrl}" target="_blank">View Post</a></td><td>${res.status}</td>`;
                    tbody.appendChild(tr);
                });
                table.style.display = 'table';
            } catch (err) {
                alert("Failed to connect to the server.");
            } finally {
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
